<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Plan Board</title>
<style>
:root {
  --bg: #fde6cc;
  --grid: #f8d3ac;
  --paper: #fff7ee;
  --line: #7a3b3b;
  --line-soft: #dcae8f;
  --ink: #5a2d2d;
  --ink-soft: #8d5a56;
  --purple-soft: #e4daf6;
  --purple-deep: #b9a2e3;
  --purple: #c9bbee;
  --lilac: #efe9fb;
  --orange: #fbd29a;
  --orange-deep: #f6b872;
  --orange-soft: #fde6c4;
  --blue: #b9d0f5;
  --blue-soft: #e3edfc;
  --pink: #f7bfc6;
  --pink-deep: #f2a3a8;
  --pink-soft: #fde0e3;
  --orange-strong: #e8782a;
  --stroke: 2.5px;
  --radius: 16px;
  --mono: "Courier Prime", "Courier New", ui-monospace, Menlo, monospace;
  --font: ui-rounded, "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); font-family: var(--font); line-height: 1.4; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  padding: 20px 16px 60px; max-width: 1400px; margin: 0 auto;
}
h1, h2, h3 { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.mono { font-family: var(--mono); }

/* browser-window panels */
.win { background: var(--paper); border: var(--stroke) solid var(--line); border-radius: 20px; overflow: hidden; margin-bottom: 22px; box-shadow: 5px 5px 0 var(--purple-deep); }
.titlebar { display: flex; align-items: flex-end; gap: 10px; background: var(--purple); border-bottom: var(--stroke) solid var(--line); padding: 8px 12px 0; }
.tab { font-family: var(--mono); font-weight: 700; font-size: .85rem; background: var(--paper); border: var(--stroke) solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 2px 12px; margin-bottom: -2.5px; white-space: nowrap; }
.tab b { margin-left: 8px; }
.nav { font-family: var(--mono); font-weight: 700; letter-spacing: .25em; align-self: center; font-size: .9rem; }
.addr { flex: 1; height: 16px; background: var(--blue-soft); border: 2px solid var(--line); border-radius: 999px; align-self: center; min-width: 40px; }
.titlebar .ic { align-self: center; margin: 0; width: 20px; height: 20px; }
#head-win { box-shadow: 5px 5px 0 var(--pink-deep); }
.win.w-steps { box-shadow: 5px 5px 0 var(--purple-deep); }
.win.w-arch { box-shadow: 5px 5px 0 var(--blue); }
.win.w-files { box-shadow: 5px 5px 0 var(--orange-deep); }
.body { padding: 16px 18px; position: relative; }
.body > .bar { margin-top: 0; }
.sub { font-family: var(--mono); font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.deco { position: absolute; right: 14px; top: 8px; width: 150px; height: 70px; pointer-events: none; opacity: .95; }

/* header */
.head { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
.head h1 { font-size: 1.6rem; }
.head p { margin: 4px 0 0; color: var(--ink-soft); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stat { border: 2px solid var(--line); border-radius: 14px; background: var(--orange-soft); padding: 5px 12px; min-width: 84px; text-align: center; }
.stat b { display: block; font-size: 1.2rem; font-family: var(--mono); }
.stat span { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
.stat.blue { background: var(--blue); }
.stat.pink { background: var(--pink); }
.stat.warn { background: var(--purple); border-style: dashed; }
.bubble { position: relative; background: var(--paper); border: var(--stroke) solid var(--line); border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 10px; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -11px; margin-left: -8px; width: 12px; height: 12px; background: var(--paper); border-right: var(--stroke) solid var(--line); border-bottom: var(--stroke) solid var(--line); transform: rotate(45deg) skew(10deg, 10deg); }
.bubble svg { width: 20px; height: 20px; margin: 0 1px; }
.bubble span { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
details.notes { margin-top: 12px; }
details.notes summary { cursor: pointer; font-weight: 700; font-family: var(--mono); }
details.notes ul { margin: 6px 0 0; padding-left: 20px; }
.dialog { margin-top: 14px; max-width: 460px; border: var(--stroke) solid var(--line); border-radius: 14px; background: var(--paper); padding: 12px 16px; text-align: center; font-family: var(--mono); box-shadow: 4px 4px 0 var(--blue); }
.dialog ul { text-align: left; margin: 6px 0 10px; padding-left: 20px; font-size: .85rem; }
.dialog .pill { justify-content: center; }
.dialog p { margin: 0 0 6px; font-weight: 700; }

/* pill buttons: two options, like YES / NO */
.pill { display: inline-flex; gap: 8px; }
.pill button {
  font-family: var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .8rem;
  border: 2px solid var(--line); border-radius: 999px; background: var(--purple); padding: 3px 18px;
}
.pill button[aria-pressed="true"] { background: var(--orange); box-shadow: 2px 2px 0 var(--line); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tools { display: flex; gap: 6px; margin-bottom: 6px; }
.tools button { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; min-width: 34px; height: 34px; font-family: var(--mono); font-weight: 700; padding: 0 12px; }
.tools button:hover { background: var(--blue); }

/* pan-zoom */
.pz {
  position: relative; overflow: hidden; height: 62vh; min-height: 340px;
  border: 2px dotted var(--line); border-radius: var(--radius);
  background-color: #fff2ea; background-image: radial-gradient(var(--line-soft) 1.2px, transparent 1.2px); background-size: 22px 22px;
  cursor: grab; touch-action: none;
}
.pz.dragging { cursor: grabbing; }
.pz-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.pz-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-soft); font-family: var(--mono); }
.hint { font-family: var(--mono); font-size: .75rem; color: var(--ink-soft); margin-top: 6px; }
.canvas-wrap { display: grid; grid-template-columns: 1fr; gap: 16px; }
.canvas-wrap.with-drawer { grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); }
@media (max-width: 800px) { .canvas-wrap.with-drawer { grid-template-columns: 1fr; } }
#drawer { display: none; padding: 10px; }
.with-drawer #drawer { display: block; }

/* step cards */
.card { position: relative; background: #fffdf8; border: var(--stroke) solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: 3px 3px 0 var(--purple-soft); }
.card h3 { font-size: 1.05rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* selected: dotted box with corner handles */
.card.sel, .mcard.sel { border-style: solid; }
.card.sel::after, .mcard.sel::after {
  content: ""; position: absolute; inset: -10px; border: 2px dotted var(--line); pointer-events: none;
  background:
    linear-gradient(var(--paper), var(--paper)) top left / 8px 8px no-repeat,
    linear-gradient(var(--paper), var(--paper)) top right / 8px 8px no-repeat,
    linear-gradient(var(--paper), var(--paper)) bottom left / 8px 8px no-repeat,
    linear-gradient(var(--paper), var(--paper)) bottom right / 8px 8px no-repeat;
}
.num, .mnum { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 50%; background: var(--orange); border: 2px solid var(--line); color: var(--ink); font-family: var(--mono); font-size: .8rem; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
.chip { border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: .78rem; background: var(--blue-soft); }
.chip.dep { cursor: pointer; }
.chip.dep:hover { background: var(--blue); }
.spill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 10px; font-family: var(--mono); font-size: .68rem; font-weight: 700; border: 2px solid var(--line); background: var(--purple); text-transform: uppercase; letter-spacing: .04em; }
.spill.in_progress { background: var(--orange); }
.spill.done { background: var(--pink-deep); }
.spill.done::before, .flag.crit::before, .flag.gap::before { content: ""; width: 12px; height: 12px; background-size: contain; background-repeat: no-repeat; }
.spill.done::before { background-image: var(--i-heart); }
.flag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-family: var(--mono); font-size: .66rem; font-weight: 700; border: 2px solid var(--line); text-transform: uppercase; }
.flag.crit { background: var(--orange); }
.flag.crit::before { background-image: var(--i-star); }
.flag.gap { background: var(--orange-soft); border-style: dashed; }
.flag.gap::before { background-image: var(--i-xcircle); }
.flag.guess { background: #fff0c2; border-style: dashed; }
.sec { margin-top: 10px; }
.sec > b { font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); display: block; margin-bottom: 3px; }
.files { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: .82rem; }
.files li { padding: 1px 0; word-break: break-all; }
.gwt { border-left: 4px solid var(--pink-deep); padding: 2px 0 2px 10px; margin: 6px 0; font-size: .9rem; }
.gwt div span { font-family: var(--mono); font-weight: 700; color: var(--orange-strong); display: inline-block; min-width: 3.8em; }
.nocov { border: 2px dashed var(--line); border-radius: 12px; padding: 6px 10px; background: var(--orange-soft); font-size: .88rem; }
.list { display: grid; gap: 18px; padding: 8px 10px; }
#view-list { display: none; }

/* mermaid cards (inside the svg) */
.mcard { position: relative; width: 220px; background: #fffdf8; border: var(--stroke) solid var(--line); border-radius: var(--radius); padding: 8px 12px; text-align: left; font-family: var(--font); font-size: 14px; line-height: 1.3; color: var(--ink); white-space: normal; box-shadow: 3px 3px 0 var(--purple-soft); }
.mcard.st-done { background: var(--pink-soft); }
.mcard.st-in_progress { background: #fff1d9; }
.mtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.mtitle { font-weight: 800; }
.mmeta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin: 2px 0 4px; }
.node { cursor: pointer; }
.node .label, .node .nodeLabel { color: var(--ink); }
#tree-pz .node, #arch-pz .node { cursor: grab; }
#arch-pz { background-color: var(--blue-soft); background-image: radial-gradient(var(--blue) 1.4px, transparent 1.4px); }
.edgeLabel, .labelBkg { background: transparent !important; }

/* icons: line-drawn with pastel fills (CSS vars filled in by script) */
.ic { display: inline-block; width: 21px; height: 21px; vertical-align: -5px; margin-right: 6px; background-size: contain; background-repeat: no-repeat; background-position: center; }

/* decisions */
.decisions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
.decision { border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; background: var(--blue-soft); }
.decision:nth-child(even) { background: var(--pink-soft); }
.decision b { display: block; font-family: var(--mono); }
.decision p { margin: 2px 0 0; font-size: .9rem; color: var(--ink-soft); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: .8rem; }
.pz.short { height: 44vh; }
.err { color: #8a1c1c; padding: 16px; }
</style>
</head>
<body>

<div class="win" id="head-win">
  <div class="titlebar"><span class="tab">plan board <b>×</b></span><span class="nav">← → ↻</span><span class="addr"></span><span class="ic star"></span></div>
  <div class="body" id="head"></div>
</div>

<section class="win w-steps">
  <div class="titlebar"><span class="tab">steps <b>×</b></span><span class="nav">← → ↻</span><span class="addr"></span><span class="ic star"></span></div>
  <div class="body">
  <div class="bar">
    <span class="sub"><span class="ic sparkle"></span>Steps</span>
    <div class="pill" role="group" aria-label="View">
      <button id="v-canvas" aria-pressed="true">Canvas</button>
      <button id="v-list" aria-pressed="false">List</button>
    </div>
  </div>
  <div id="view-canvas">
    <div class="canvas-wrap" id="canvas-wrap">
      <div>
        <div class="tools" data-for="dep-pz"></div>
        <div class="pz" id="dep-pz"></div>
        <div class="hint">drag to pan · scroll or +/− to zoom · click a card for details · thick orange line = critical path</div>
      </div>
      <aside id="drawer"></aside>
    </div>
  </div>
  <div id="view-list"><div class="list" id="list"></div></div>
  </div>
</section>

<section class="win w-arch">
  <div class="titlebar"><span class="tab">architecture <b>×</b></span><span class="nav">← → ↻</span><span class="addr"></span><span class="ic star"></span></div>
  <div class="body">
  <div class="bar">
    <span class="sub"><span class="ic globe"></span>Architecture</span>
    <div class="pill" role="group" aria-label="Architecture view">
      <button id="a-before" aria-pressed="false">Before</button>
      <button id="a-after" aria-pressed="true">After</button>
    </div>
  </div>
  <div class="decisions" id="decisions"></div>
  <div class="tools" data-for="arch-pz"></div>
  <div class="pz short" id="arch-pz"></div>
  </div>
</section>

<section class="win w-files">
  <div class="titlebar"><span class="tab">files touched <b>×</b></span><span class="nav">← → ↻</span><span class="addr"></span><span class="ic star"></span></div>
  <div class="body">
  <div class="bar">
    <span class="sub"><span class="ic folder"></span>Files touched</span>
    <div class="legend">
      <span><span class="ic create"></span>create</span>
      <span><span class="ic edit"></span>edit</span>
      <span><span class="ic delete"></span>delete</span>
    </div>
  </div>
  <div class="tools" data-for="tree-pz"></div>
  <div class="pz short" id="tree-pz"></div>
  </div>
</section>

<script>/*__MERMAID__*/</script>
<script>
"use strict";
const DATA = /*__DATA__*/null;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const byId = Object.fromEntries(DATA.steps.map(s => [s.id, s]));
const label = s => s.replace(/_/g, " ");

/* ---------- line-drawn icons (CSS background images) ---------- */
const ICONS = {
  create: "<path d='M6 3h8l4 4v14H6z' fill='#fff7ee'/><path d='M14 3v4h4'/><circle cx='12' cy='15' r='4.2' fill='#b9d0f5'/><path d='M12 13v4M10 15h4'/>",
  edit: "<path d='M4 20l1-4L16 5l3 3L8 19z' fill='#fbd29a'/><path d='M14 7l3 3'/><path d='M4 20l1-4 3 3z' fill='#f9c28e'/>",
  delete: "<path d='M7 8l1 12h8l1-12z' fill='#f7bfc6'/><path d='M5 8h14M9 8V5h6v3M10 12v5M14 12v5'/>",
  folder: "<path d='M3 7h6l2 2h10v10H3z' fill='#fbd29a'/><path d='M6 13h5' stroke='#fff7ee'/>",
  doc: "<path d='M6 3h8l4 4v14H6z' fill='#b9d0f5'/><path d='M14 3v4h4M9 13h6M9 17h4'/>",
  star: "<path d='M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z' fill='#fbd29a'/>",
  heart: "<path d='M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' fill='#f2a3a8'/>",
  mail: "<rect x='3' y='6' width='18' height='13' rx='2' fill='#fbd29a'/><path d='M3 8l9 6 9-6'/>",
  xcircle: "<circle cx='12' cy='12' r='9' fill='#f7bfc6'/><path d='M9 9l6 6M15 9l-6 6'/>",
  check: "<circle cx='12' cy='12' r='9' fill='#b9d0f5'/><path d='M8 12.5l3 3 5-6'/>",
  globe: "<circle cx='12' cy='12' r='9' fill='#b9d0f5'/><path d='M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'/>",
  sparkle: "<path d='M12 3c.6 5 1.8 6.4 7 7-5.2.6-6.4 2-7 7-.6-5-1.8-6.4-7-7 5.2-.6 6.4-2 7-7z' fill='#fff7ee'/>",
};
function iconSvg(name) {
  return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='#7a3b3b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'>" + ICONS[name] + "</svg>";
}
(function () {
  let vars = "", rules = "";
  for (const name of Object.keys(ICONS)) {
    vars += "--i-" + name + ":url(\"data:image/svg+xml," + encodeURIComponent(iconSvg(name)) + "\");";
    rules += ".ic." + name + "{background-image:var(--i-" + name + ")}\n";
  }
  document.head.appendChild(el("style", null, ":root{" + vars + "}\n" + rules));
})();

/* ---------- pan / zoom ---------- */
function panZoom(host, onClick) {
  const stage = el("div", "pz-stage");
  host.appendChild(stage);
  let x = 0, y = 0, k = 1, w = 0, h = 0;
  const apply = () => { stage.style.transform = "translate(" + x + "px," + y + "px) scale(" + k + ")"; };
  const zoomAt = (cx, cy, f) => {
    const nk = Math.min(4, Math.max(0.15, k * f));
    x = cx - (cx - x) * (nk / k); y = cy - (cy - y) * (nk / k); k = nk; apply();
  };
  const api = {
    set(svg) {
      stage.innerHTML = svg;
      const s = stage.querySelector("svg");
      const vb = s.viewBox.baseVal;
      w = vb.width; h = vb.height;
      s.setAttribute("width", w); s.setAttribute("height", h);
      s.style.maxWidth = "none";
      api.fit();
    },
    fit() {
      if (!w) return;
      const r = host.getBoundingClientRect();
      if (!r.width) return;
      k = Math.min(1.2, (r.width - 24) / w, (r.height - 24) / h);
      x = (r.width - w * k) / 2; y = (r.height - h * k) / 2; apply();
    },
    zoom(f) { const r = host.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); },
    stage,
  };
  let drag = null;
  host.addEventListener("wheel", e => {
    e.preventDefault();
    const r = host.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });
  host.addEventListener("pointerdown", e => {
    drag = { sx: e.clientX, sy: e.clientY, ox: x, oy: y, moved: false, target: e.target };
    host.setPointerCapture(e.pointerId);
  });
  host.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; host.classList.add("dragging"); }
    if (drag.moved) { x = drag.ox + dx; y = drag.oy + dy; apply(); }
  });
  const end = e => {
    if (drag && !drag.moved && onClick && e.type === "pointerup") onClick(drag.target);
    drag = null; host.classList.remove("dragging");
  };
  host.addEventListener("pointerup", end);
  host.addEventListener("pointercancel", end);
  return api;
}

function toolbar(name, pz) {
  const box = $('.tools[data-for="' + name + '"]');
  for (const [t, fn] of [["+", () => pz.zoom(1.25)], ["−", () => pz.zoom(0.8)], ["Fit", () => pz.fit()]]) {
    const b = el("button", null, t);
    b.type = "button";
    b.addEventListener("click", fn);
    box.appendChild(b);
  }
}

/* ---------- step card ---------- */
function stepCard(s, opts) {
  const c = el("article", "card" + (opts && opts.sel ? " sel" : ""));
  c.dataset.id = s.id;
  const h = el("h3");
  h.appendChild(el("span", "num", s.num));
  h.appendChild(document.createTextNode(s.title));
  h.appendChild(el("span", "spill " + s.status, label(s.status)));
  if (s.critical) h.appendChild(el("span", "flag crit", "critical path"));
  if (s.inferred.length) h.appendChild(el("span", "flag guess", "inferred: " + s.inferred.join(", ")));
  c.appendChild(h);
  if (s.depends_on.length) {
    const chips = el("div", "chips");
    chips.appendChild(el("span", null, "after"));
    for (const d of s.depends_on) {
      const ch = el("span", "chip dep", byId[d].num + " · " + byId[d].title);
      ch.addEventListener("click", e => { e.stopPropagation(); select(d); });
      chips.appendChild(ch);
    }
    c.appendChild(chips);
  }
  const files = el("div", "sec"); files.appendChild(el("b", null, "Files"));
  if (s.files.length) {
    const ul = el("ul", "files");
    for (const f of s.files) {
      const li = el("li");
      li.appendChild(el("span", "ic " + f.action));
      li.appendChild(document.createTextNode(f.path));
      ul.appendChild(li);
    }
    files.appendChild(ul);
  } else files.appendChild(el("div", "hint", "No files listed"));
  c.appendChild(files);
  const ac = el("div", "sec"); ac.appendChild(el("b", null, "Acceptance criteria"));
  if (s.acceptance_criteria.length) {
    for (const a of s.acceptance_criteria) {
      const g = el("div", "gwt");
      for (const k of ["given", "when", "then"]) {
        if (!a[k]) continue;
        const row = el("div");
        row.appendChild(el("span", null, k[0].toUpperCase() + k.slice(1)));
        row.appendChild(document.createTextNode(a[k]));
        g.appendChild(row);
      }
      ac.appendChild(g);
    }
  } else ac.appendChild(el("div", "nocov", "No acceptance criteria yet. This step has no way to be checked."));
  c.appendChild(ac);
  if (s.notes) {
    const n = el("div", "sec"); n.appendChild(el("b", null, "Notes"));
    n.appendChild(el("div", null, s.notes));
    c.appendChild(n);
  }
  return c;
}

/* ---------- header ---------- */
function heartsBubble(done, total) {
  const on = total ? Math.round(5 * done / total) : 0;
  const b = el("div", "bubble");
  const row = el("div");
  for (let i = 0; i < 5; i++) {
    const fill = i < on ? "#f2a3a8" : "#fff7ee";
    row.insertAdjacentHTML("beforeend", "<svg viewBox='0 0 24 24' stroke='#7a3b3b' stroke-width='1.8' stroke-linejoin='round'><path d='M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' fill='" + fill + "'/></svg>");
  }
  b.appendChild(row);
  b.appendChild(el("span", null, done + "/" + total + " done"));
  return b;
}
function renderHead() {
  const head = $("#head");
  head.insertAdjacentHTML("afterbegin", "<svg class='deco' viewBox='0 0 150 70' fill='#e3edfc' stroke='#7a3b3b' stroke-width='2.2' stroke-linejoin='round' stroke-linecap='round'><path d='M20 52c-8 0-12-5-10-10 1-5 7-7 12-5 2-8 14-10 19-3 6-3 14 1 14 8 6 0 8 6 4 10z'/><path d='M95 28c.7 6 2 7.5 8 8-6 .7-7.3 2.3-8 8-.7-5.700-2-7.300-8-8 6-.5 7.300-2 8-8z'/><path fill='#f7bfc6' d='M126 10c.5 4 1.300 5 5 5.500-3.700.5-4.500 1.500-5 5.500-.5-4-1.300-5-5-5.500 3.700-.5 4.500-1.500 5-5.500z'/></svg>");
  const top = el("div", "head");
  const t = el("div");
  t.appendChild(el("h1", null, DATA.title));
  if (DATA.summary) t.appendChild(el("p", null, DATA.summary));
  top.appendChild(t);
  const stats = el("div", "stats");
  const stat = (v, l, cls) => { const d = el("div", "stat " + (cls || "")); d.appendChild(el("b", null, v)); d.appendChild(el("span", null, l)); return d; };
  const done = DATA.steps.filter(s => s.status === "done").length;
  stats.appendChild(heartsBubble(done, DATA.steps.length));
  stats.appendChild(stat(DATA.steps.length, "steps", "blue"));
  stats.appendChild(stat(DATA.n_files, "files", "pink"));
  stats.appendChild(stat(DATA.complexity, "complexity"));
  const gaps = DATA.steps.filter(s => !s.covered).length;
  stats.appendChild(stat((DATA.steps.length - gaps) + "/" + DATA.steps.length, "covered", gaps ? "warn" : ""));
  stats.appendChild(stat(DATA.open_questions.length + DATA.risks.length, "open Qs & risks", DATA.open_questions.length + DATA.risks.length ? "warn" : ""));
  top.appendChild(stats);
  head.appendChild(top);
  const lists = [["Open questions", DATA.open_questions, "mail"], ["Risks", DATA.risks, "xcircle"]];
  for (const [name, items, icon] of lists) {
    if (!items.length) continue;
    const d = el("details", "notes"); d.open = true;
    const sm = el("summary"); sm.appendChild(el("span", "ic " + icon)); sm.appendChild(document.createTextNode(name + " (" + items.length + ")"));
    d.appendChild(sm);
    const ul = el("ul");
    for (const i of items) ul.appendChild(el("li", null, i));
    d.appendChild(ul); head.appendChild(d);
  }
  if (DATA.inferred.length) {
    const b = el("div", "dialog");
    b.appendChild(el("p", null, "some parts were guessed. look right?"));
    const ul = el("ul");
    for (const i of DATA.inferred) ul.appendChild(el("li", null, i));
    b.appendChild(ul);
    const msg = el("div", "hint");
    const pill = el("div", "pill");
    const yes = el("button", null, "Yes"), no = el("button", null, "No");
    yes.type = no.type = "button";
    yes.onclick = () => { ul.style.display = "none"; msg.textContent = "ok! (this view only) ask Claude to clear the guesses from the YAML so this goes away."; };
    no.onclick = () => { ul.style.display = ""; msg.textContent = "tell Claude what to change. it updates the YAML and rebuilds the board."; };
    pill.appendChild(yes); pill.appendChild(no);
    b.appendChild(pill); b.appendChild(msg);
    head.appendChild(b);
  }
}

/* ---------- selection + views ---------- */
let selected = null, depPz;
function select(id) {
  const wasOpen = selected !== null;
  selected = selected === id ? null : id;
  for (const c of document.querySelectorAll(".mcard.sel, .card.sel")) c.classList.remove("sel");
  const drawer = $("#drawer"); drawer.innerHTML = "";
  $("#canvas-wrap").classList.toggle("with-drawer", !!selected);
  if (selected) {
    drawer.appendChild(stepCard(byId[selected], { sel: true }));
    const n = nodeFor(selected);
    if (n) n.querySelector(".mcard").classList.add("sel");
    const lc = $("#list .card[data-id='" + CSS.escape(selected) + "']");
    if (lc) lc.classList.add("sel");
  }
  if (depPz && wasOpen !== (selected !== null)) setTimeout(() => depPz.fit(), 0);  // only when the drawer opens/closes
}
function nodeFor(id) {
  const i = DATA.steps.findIndex(s => s.id === id);
  for (const n of document.querySelectorAll("#dep-pz .node"))
    if (new RegExp("^flowchart-n" + i + "-").test(n.id)) return n;
  return null;
}
function setView(v) {
  $("#view-canvas").style.display = v === "canvas" ? "" : "none";
  $("#view-list").style.display = v === "list" ? "block" : "none";
  $("#v-canvas").setAttribute("aria-pressed", v === "canvas");
  $("#v-list").setAttribute("aria-pressed", v === "list");
  if (v === "canvas" && depPz) depPz.fit();
}

/* ---------- boot ---------- */
async function boot() {
  renderHead();
  const list = $("#list");
  for (const id of DATA.order) {
    const c = stepCard(byId[id]);
    c.addEventListener("click", () => select(id));
    list.appendChild(c);
  }
  $("#v-canvas").onclick = () => setView("canvas");
  $("#v-list").onclick = () => setView("list");

  const dec = $("#decisions");
  if (!DATA.decisions.length) dec.style.display = "none";
  for (const d of DATA.decisions) {
    const b = el("div", "decision"); b.appendChild(el("b", null, d.title)); b.appendChild(el("p", null, d.detail)); dec.appendChild(b);
  }

  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    themeVariables: {
      fontFamily: getComputedStyle(document.body).fontFamily, fontSize: "14px",
      lineColor: "#7a3b3b", primaryColor: "#fff7ee", primaryBorderColor: "#7a3b3b",
      primaryTextColor: "#5a2d2d", edgeLabelBackground: "#fff2ea",
    },
    flowchart: { htmlLabels: true, curve: "basis", nodeSpacing: 36, rankSpacing: 70, padding: 6, useMaxWidth: false },
  });
  const draw = async (id, src) => {
    try { return (await mermaid.render(id, src)).svg; }
    finally { const junk = document.getElementById("d" + id); if (junk) junk.remove(); }  // mermaid leaves this behind on errors
  };

  depPz = panZoom($("#dep-pz"), target => {
    const n = target.closest(".node");
    if (!n) return;
    const m = /^flowchart-n(\d+)-/.exec(n.id);
    if (m) select(DATA.steps[+m[1]].id);
  });
  toolbar("dep-pz", depPz);
  const treePz = panZoom($("#tree-pz"));
  toolbar("tree-pz", treePz);
  const archPz = panZoom($("#arch-pz"));
  toolbar("arch-pz", archPz);

  const fail = (host, e) => { host.appendChild(el("div", "err", "Could not draw this diagram: " + (e && e.message || e))); };
  try { if (DATA.steps.length) depPz.set(await draw("dep", DATA.dep_mermaid)); else $("#dep-pz").appendChild(el("div", "pz-empty", "No steps in this plan")); } catch (e) { fail($("#dep-pz"), e); }
  try { if (DATA.n_files) treePz.set(await draw("tree", DATA.tree_mermaid)); else $("#tree-pz").appendChild(el("div", "pz-empty", "No files listed")); } catch (e) { fail($("#tree-pz"), e); }

  const arch = DATA.architecture, rendered = {};
  const showArch = async which => {
    $("#a-before").setAttribute("aria-pressed", which === "before");
    $("#a-after").setAttribute("aria-pressed", which === "after");
    const src = arch[which];
    for (const e of $("#arch-pz").querySelectorAll(".pz-empty,.err")) e.remove();
    archPz.stage.innerHTML = "";
    if (!src) { archPz.stage.innerHTML = ""; $("#arch-pz").appendChild(el("div", "pz-empty", "No " + which + " diagram provided")); return; }
    try {
      if (!rendered[which]) rendered[which] = await draw("arch-" + which, src);
      archPz.set(rendered[which]);
    } catch (e) { fail($("#arch-pz"), e); }
  };
  $("#a-before").onclick = () => showArch("before");
  $("#a-after").onclick = () => showArch("after");
  await showArch("after");
  window.addEventListener("resize", () => depPz.fit());
  document.documentElement.dataset.ready = "1";
}
boot();
</script>
</body>
</html>
